<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Alumnos Registrados</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos específicos del panel administrativo */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card.green {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }

        .stat-card.blue {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .stat-card.orange {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .filters-section {
            background-color: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid #e5e7eb;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        .filter-group input,
        .filter-group select {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        thead {
            background-color: #f9fafb;
            border-bottom: 2px solid #e5e7eb;
        }

        th {
            padding: 16px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s;
        }

        th:hover {
            background-color: #f3f4f6;
        }

        td {
            padding: 14px 16px;
            font-size: 14px;
            color: #1f2937;
            border-bottom: 1px solid #f3f4f6;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-a {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .badge-b {
            background-color: #dcfce7;
            color: #166534;
        }

        .badge-c {
            background-color: #fed7aa;
            color: #9b2c1d;
        }

        .action-icon {
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            display: inline-block;
        }

        .action-icon.delete {
            color: #ef4444;
        }

        .action-icon.delete:hover {
            background-color: #fee2e2;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                flex: 1;
                text-align: center;
            }

            th, td {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="card">
            <div class="header">
                <div>
                    <h1>📋 Panel de Alumnos Registrados</h1>
                    <div class="subtitle">Gestión completa de alumnos y sus comisiones</div>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-primary" id="nuevoAlumnoBtn">
                        ➕ Nuevo Alumno
                    </button>
                    <button class="btn btn-secondary" id="exportBtn">
                        📊 Exportar a Excel
                    </button>
                    <button class="btn btn-danger" id="refreshBtn">
                        🔄 Actualizar
                    </button>
                </div>
            </div>

            <!-- Estadísticas -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-number" id="totalAlumnos">0</div>
                    <div class="stat-label">Total Alumnos</div>
                </div>
                <div class="stat-card green">
                    <div class="stat-number" id="totalComisionA">0</div>
                    <div class="stat-label">Comisión A</div>
                </div>
                <div class="stat-card blue">
                    <div class="stat-number" id="totalComisionB">0</div>
                    <div class="stat-label">Comisión B</div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-number" id="totalComisionC">0</div>
                    <div class="stat-label">Comisión C</div>
                </div>
            </div>

            <!-- Filtros -->
            <div class="filters-section">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label>🔍 Buscar por nombre o apellido</label>
                        <input type="text" id="searchInput" placeholder="Escriba para buscar...">
                    </div>
                    <div class="filter-group">
                        <label>📌 Filtrar por comisión</label>
                        <select id="comisionFilter">
                            <option value="">Todas las comisiones</option>
                            <option value="Comisión A">Comisión A</option>
                            <option value="Comisión B">Comisión B</option>
                            <option value="Comisión C">Comisión C</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>📅 Buscar por DNI</label>
                        <input type="text" id="dniFilter" placeholder="DNI del alumno">
                    </div>
                    <div class="filter-actions">
                        <button class="btn btn-primary" id="applyFiltersBtn" style="padding: 8px 16px;">
                            Aplicar Filtros
                        </button>
                        <button class="btn" id="clearFiltersBtn" style="background-color: #e5e7eb; padding: 8px 16px;">
                            Limpiar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabla de alumnos -->
            <div class="table-container">
                <div id="loadingState" class="loading">
                    <div class="spinner"></div>
                    Cargando alumnos...
                </div>
                <div id="tableContent" style="display: none;">
                    <table id="alumnosTable">
                        <thead>
                            <tr>
                                <th data-sort="nombre">Nombre ⬍</th>
                                <th data-sort="apellido">Apellido ⬍</th>
                                <th data-sort="dni">DNI ⬍</th>
                                <th data-sort="comision">Comisión ⬍</th>
                                <th data-sort="fecha_registro">Fecha Registro ⬍</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Los datos se cargarán aquí dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación para eliminar -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3>⚠️ Confirmar eliminación</h3>
            <p id="deleteMessage">¿Está seguro que desea eliminar este alumno?</p>
            <div class="modal-buttons">
                <button class="btn btn-danger" id="confirmDeleteBtn">Eliminar</button>
                <button class="btn" id="cancelDeleteBtn" style="background-color: #e5e7eb;">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- JavaScript del panel administrativo -->
    <script src="admin.js"></script>
</body>
</html>
