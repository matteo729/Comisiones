<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Alumnos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 32px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            font-size: 24px;
            color: #1a1a1a;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card.comision1 {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
        }

        .stat-card.comision2 {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
        }

        .stat-card.comision3 {
            background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: white;
            border-radius: 4px;
            transition: width 0.3s;
        }

        .filters-section {
            background-color: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid #e5e7eb;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #374151;
        }

        .filter-group input,
        .filter-group select {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-secondary {
            background-color: #22c55e;
            color: white;
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-purple {
            background-color: #8b5cf6;
            color: white;
        }

        .btn-purple:hover {
            background-color: #7c3aed;
        }

        .table-container {
            overflow-x: auto;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #f9fafb;
            padding: 16px;
            text-align: left;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid #e5e7eb;
        }

        th:hover {
            background-color: #e5e7eb;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #f3f4f6;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-1 {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .badge-2 {
            background-color: #dcfce7;
            color: #166534;
        }

        .badge-3 {
            background-color: #fed7aa;
            color: #9b2c1d;
        }

        .delete-btn {
            color: #ef4444;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .delete-btn:hover {
            background-color: #fee2e2;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #22c55e;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        .toast.error {
            background-color: #ef4444;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div>
                    <h1>📋 Panel de Alumnos Registrados</h1>
                    <div class="subtitle">Gestión completa de alumnos - Límite: 60 alumnos por comisión</div>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="window.location.href='index.html'">➕ Nuevo Alumno</button>
                    <button class="btn btn-secondary" id="exportExcelBtn">📊 Exportar a Excel</button>
                    <button class="btn btn-purple" id="exportPdfBtn">📄 Exportar a PDF</button>
                    <button class="btn btn-danger" id="refreshBtn">🔄 Actualizar</button>
                </div>
            </div>

            <div class="stats-grid" id="statsGrid"></div>

            <div class="filters-section">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label>🔍 Buscar por nombre o apellido</label>
                        <input type="text" id="searchInput" placeholder="Escriba para buscar...">
                    </div>
                    <div class="filter-group">
                        <label>📌 Filtrar por comisión</label>
                        <select id="comisionFilter">
                            <option value="">Todas</option>
                            <option value="Comisión 1">Comisión 1</option>
                            <option value="Comisión 2">Comisión 2</option>
                            <option value="Comisión 3">Comisión 3</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>🔢 Buscar por DNI</label>
                        <input type="text" id="dniFilter" placeholder="DNI">
                    </div>
                    <div class="filter-group">
                        <label>🌐 Buscar por IP</label>
                        <input type="text" id="ipFilter" placeholder="IP Address">
                    </div>
                </div>
                <div style="margin-top: 16px; display: flex; gap: 10px;">
                    <button class="btn btn-primary" id="applyFiltersBtn">Aplicar Filtros</button>
                    <button class="btn" id="clearFiltersBtn" style="background: #e5e7eb;">Limpiar</button>
                </div>
            </div>

            <div class="table-container">
                <div id="loadingState" class="loading">
                    <div>Cargando alumnos...</div>
                </div>
                <div id="tableContent" style="display: none;">
                    <table id="alumnosTable">
                        <thead>
                            <tr>
                                <th onclick="sortTable('nombre')">Nombre ⬍</th>
                                <th onclick="sortTable('apellido')">Apellido ⬍</th>
                                <th onclick="sortTable('dni')">DNI ⬍</th>
                                <th onclick="sortTable('comision')">Comisión ⬍</th>
                                <th onclick="sortTable('ip_address')">IP Address ⬍</th>
                                <th onclick="sortTable('fecha_registro')">Fecha Registro ⬍</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <h3>⚠️ Confirmar eliminación</h3>
            <p id="deleteMessage">¿Está seguro?</p>
            <div class="modal-buttons">
                <button class="btn btn-danger" id="confirmDeleteBtn">Eliminar</button>
                <button class="btn" id="cancelDeleteBtn">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Librerías para PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const SUPABASE_URL = 'https://abhmcfmbsqpqodbedsum.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFiaG1jZm1ic3FwcW9kYmVkc3VtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyOTA3MTMsImV4cCI6MjA4OTg2NjcxM30.KIqfK4_NhBMj3cwhHCwhFbDRTxwS5NAYi_QOyvcA210';
            
            const LIMITE_POR_COMISION = 60;
            
            if (typeof supabase === 'undefined') {
                console.error('Supabase no se cargó correctamente');
                alert('Error: No se pudo cargar Supabase.');
                return;
            }
            
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('Supabase inicializado correctamente');
            
            let allAlumnos = [];
            let filteredAlumnos = [];
            let currentSort = { column: 'fecha_registro', direction: 'desc' };
            let alumnoToDelete = null;
            
            function showToast(message, isError = false) {
                const toast = document.createElement('div');
                toast.className = 'toast' + (isError ? ' error' : '');
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
            
            function formatDate(dateString) {
                if (!dateString) return 'N/A';
                const date = new Date(dateString);
                return date.toLocaleString('es-AR');
            }
            
            function getBadge(comision) {
                let badgeClass = '';
                if (comision === 'Comisión 1') badgeClass = 'badge-1';
                else if (comision === 'Comisión 2') badgeClass = 'badge-2';
                else badgeClass = 'badge-3';
                return `<span class="badge ${badgeClass}">${comision}</span>`;
            }
            
            function updateStats() {
                const statsGrid = document.getElementById('statsGrid');
                
                const comision1Total = allAlumnos.filter(a => a.comision === 'Comisión 1').length;
                const comision2Total = allAlumnos.filter(a => a.comision === 'Comisión 2').length;
                const comision3Total = allAlumnos.filter(a => a.comision === 'Comisión 3').length;
                
                statsGrid.innerHTML = `
                    <div class="stat-card comision1">
                        <div class="stat-number">${comision1Total}/${LIMITE_POR_COMISION}</div>
                        <div class="stat-label">Comisión 1</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${(comision1Total / LIMITE_POR_COMISION) * 100}%"></div>
                        </div>
                    </div>
                    <div class="stat-card comision2">
                        <div class="stat-number">${comision2Total}/${LIMITE_POR_COMISION}</div>
                        <div class="stat-label">Comisión 2</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${(comision2Total / LIMITE_POR_COMISION) * 100}%"></div>
                        </div>
                    </div>
                    <div class="stat-card comision3">
                        <div class="stat-number">${comision3Total}/${LIMITE_POR_COMISION}</div>
                        <div class="stat-label">Comisión 3</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${(comision3Total / LIMITE_POR_COMISION) * 100}%"></div>
                        </div>
                    </div>
                    <div class="stat-card" style="background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);">
                        <div class="stat-number">${allAlumnos.length}/${LIMITE_POR_COMISION * 3}</div>
                        <div class="stat-label">Total General</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${(allAlumnos.length / (LIMITE_POR_COMISION * 3)) * 100}%"></div>
                        </div>
                    </div>
                `;
            }
            
            function renderTable() {
                const tbody = document.getElementById('tableBody');
                
                if (filteredAlumnos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:40px;">📭 No hay alumnos registrados</td></tr>';
                    return;
                }
                
                const sorted = [...filteredAlumnos].sort((a, b) => {
                    let valA = a[currentSort.column];
                    let valB = b[currentSort.column];
                    if (currentSort.column === 'fecha_registro') {
                        valA = new Date(valA);
                        valB = new Date(valB);
                    } else if (typeof valA === 'string') {
                        valA = valA.toLowerCase();
                        valB = valB.toLowerCase();
                    }
                    if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                    return 0;
                });
                
                tbody.innerHTML = sorted.map(alumno => `
                    <tr>
                        <td><strong>${escapeHtml(alumno.nombre)}</strong></td>
                        <td>${escapeHtml(alumno.apellido)}</td>
                        <td>${escapeHtml(alumno.dni)}</td>
                        <td>${getBadge(alumno.comision)}</td>
                        <td><code style="font-size: 12px;">${escapeHtml(alumno.ip_address || 'N/A')}</code></td>
                        <td>${formatDate(alumno.fecha_registro)}</td>
                        <td><span class="delete-btn" onclick="window.deleteAlumno('${alumno.id}', '${escapeHtml(alumno.nombre)} ${escapeHtml(alumno.apellido)}')">🗑️ Eliminar</span></td>
                    </tr>
                `).join('');
            }
            
            function escapeHtml(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            window.sortTable = function(column) {
                if (currentSort.column === column) {
                    currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort.column = column;
                    currentSort.direction = 'asc';
                }
                renderTable();
            };
            
            function applyFilters() {
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                const comisionValue = document.getElementById('comisionFilter').value;
                const dniValue = document.getElementById('dniFilter').value;
                const ipValue = document.getElementById('ipFilter').value.toLowerCase();
                
                filteredAlumnos = allAlumnos.filter(alumno => {
                    if (searchTerm) {
                        const fullName = `${alumno.nombre} ${alumno.apellido}`.toLowerCase();
                        if (!fullName.includes(searchTerm)) return false;
                    }
                    if (comisionValue && alumno.comision !== comisionValue) return false;
                    if (dniValue && !alumno.dni.includes(dniValue)) return false;
                    if (ipValue && (!alumno.ip_address || !alumno.ip_address.toLowerCase().includes(ipValue))) return false;
                    return true;
                });
                renderTable();
                showToast(`Mostrando ${filteredAlumnos.length} de ${allAlumnos.length} alumnos`);
            }
            
            function clearFilters() {
                document.getElementById('searchInput').value = '';
                document.getElementById('comisionFilter').value = '';
                document.getElementById('dniFilter').value = '';
                document.getElementById('ipFilter').value = '';
                filteredAlumnos = [...allAlumnos];
                renderTable();
                showToast('Filtros limpiados');
            }
            
            window.deleteAlumno = function(id, nombre) {
                alumnoToDelete = id;
                document.getElementById('deleteMessage').textContent = `¿Eliminar a ${nombre}?`;
                document.getElementById('deleteModal').classList.add('show');
            };
            
            async function confirmDelete() {
                if (!alumnoToDelete) return;
                
                try {
                    const { error } = await supabaseClient
                        .from('alumnos')
                        .delete()
                        .eq('id', alumnoToDelete);
                    
                    if (error) {
                        showToast('Error al eliminar: ' + error.message, true);
                    } else {
                        showToast('Alumno eliminado correctamente');
                        await loadAlumnos();
                    }
                } catch (error) {
                    showToast('Error: ' + error.message, true);
                }
                closeModal();
            }
            
            function closeModal() {
                document.getElementById('deleteModal').classList.remove('show');
                alumnoToDelete = null;
            }
            
            async function loadAlumnos() {
                const loadingState = document.getElementById('loadingState');
                const tableContent = document.getElementById('tableContent');
                
                loadingState.style.display = 'block';
                tableContent.style.display = 'none';
                
                try {
                    console.log('Cargando alumnos...');
                    const { data, error } = await supabaseClient
                        .from('alumnos')
                        .select('*')
                        .order('fecha_registro', { ascending: false });
                    
                    if (error) {
                        console.error('Error de Supabase:', error);
                        loadingState.innerHTML = '<div>❌ Error al cargar datos: ' + error.message + '</div>';
                        showToast('Error al cargar datos: ' + error.message, true);
                        return;
                    }
                    
                    console.log('Datos cargados:', data);
                    allAlumnos = data || [];
                    filteredAlumnos = [...allAlumnos];
                    updateStats();
                    renderTable();
                    
                    loadingState.style.display = 'none';
                    tableContent.style.display = 'block';
                    
                    if (allAlumnos.length === 0) {
                        showToast('No hay alumnos registrados aún');
                    } else {
                        showToast(`${allAlumnos.length} alumnos cargados`);
                    }
                } catch (error) {
                    console.error('Error de conexión:', error);
                    loadingState.innerHTML = '<div>❌ Error de conexión. Verifica tu internet.</div>';
                    showToast('Error de conexión: ' + error.message, true);
                }
            }
            
            // EXPORTAR A EXCEL - FUNCIONA CORRECTAMENTE
            function exportToExcel() {
                if (filteredAlumnos.length === 0) {
                    showToast('No hay datos para exportar', true);
                    return;
                }
                
                try {
                    // Preparar los datos para Excel
                    const excelData = filteredAlumnos.map((alumno, index) => ({
                        'N°': index + 1,
                        'Apellido': alumno.apellido,
                        'Nombre': alumno.nombre,
                        'DNI': alumno.dni,
                        'Comisión': alumno.comision,
                        'IP Address': alumno.ip_address || 'N/A',
                        'Fecha Registro': formatDate(alumno.fecha_registro)
                    }));
                    
                    // Crear hoja de cálculo
                    const worksheet = XLSX.utils.json_to_sheet(excelData);
                    
                    // Ajustar ancho de columnas
                    const colWidths = [
                        { wch: 6 },  // N°
                        { wch: 20 }, // Apellido
                        { wch: 20 }, // Nombre
                        { wch: 15 }, // DNI
                        { wch: 12 }, // Comisión
                        { wch: 15 }, // IP Address
                        { wch: 20 }  // Fecha Registro
                    ];
                    worksheet['!cols'] = colWidths;
                    
                    // Crear libro de trabajo
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, 'Alumnos');
                    
                    // Generar y descargar archivo
                    const fecha = new Date().toISOString().split('T')[0];
                    XLSX.writeFile(workbook, `alumnos_${fecha}.xlsx`);
                    
                    showToast(`Exportados ${filteredAlumnos.length} alumnos a Excel`);
                } catch (error) {
                    console.error('Error al exportar a Excel:', error);
                    showToast('Error al exportar a Excel', true);
                }
            }
            
            // EXPORTAR A PDF - CON COMISIÓN 1, 2, 3
            function exportToPDF() {
                if (filteredAlumnos.length === 0) {
                    showToast('No hay datos para exportar', true);
                    return;
                }
                
                showToast('Generando PDF...');
                
                const pdfContent = document.createElement('div');
                pdfContent.style.padding = '20px';
                pdfContent.style.fontFamily = 'Arial, sans-serif';
                pdfContent.style.backgroundColor = 'white';
                
                // Calcular estadísticas
                const total1 = filteredAlumnos.filter(a => a.comision === 'Comisión 1').length;
                const total2 = filteredAlumnos.filter(a => a.comision === 'Comisión 2').length;
                const total3 = filteredAlumnos.filter(a => a.comision === 'Comisión 3').length;
                
                // Ordenar alfabéticamente por apellido para el PDF
                const sortedForPDF = [...filteredAlumnos].sort((a, b) => {
                    const nombreCompletoA = `${a.apellido} ${a.nombre}`;
                    const nombreCompletoB = `${b.apellido} ${b.nombre}`;
                    return nombreCompletoA.localeCompare(nombreCompletoB);
                });
                
                pdfContent.innerHTML = `
                    <div style="text-align: center; margin-bottom: 30px;">
                        <h1 style="color: #1e40af; font-size: 24px; margin-bottom: 10px;">📋 Listado de Alumnos</h1>
                        <p style="color: #6b7280; font-size: 12px;">
                            Fecha de generación: ${new Date().toLocaleString('es-AR')}<br>
                            Total de alumnos: ${filteredAlumnos.length} | Límite por comisión: ${LIMITE_POR_COMISION} alumnos
                        </p>
                    </div>
                    
                    <div style="margin-bottom: 30px; background-color: #f3f4f6; padding: 15px; border-radius: 8px;">
                        <h3 style="color: #374151; margin-bottom: 10px;">📊 Resumen por Comisión</h3>
                        <table style="width: 100%; border-collapse: collapse;">
                            <tr style="background-color: #3b82f6; color: white;">
                                <th style="padding: 10px; text-align: left;">Comisión</th>
                                <th style="padding: 10px; text-align: center;">Cantidad</th>
                                <th style="padding: 10px; text-align: center;">Cupo</th>
                                <th style="padding: 10px; text-align: center;">Disponible</th>
                            </tr>
                            <tr>
                                <td style="padding: 8px; border-bottom: 1px solid #ddd;">Comisión 1</td>
                                <td style="padding: 8px; text-align: center;">${total1}</td>
                                <td style="padding: 8px; text-align: center;">${LIMITE_POR_COMISION}</td>
                                <td style="padding: 8px; text-align: center; color: ${LIMITE_POR_COMISION - total1 <= 10 ? '#f59e0b' : '#22c55e'};">${LIMITE_POR_COMISION - total1}</td>
                            </tr>
                            <tr>
                                <td style="padding: 8px; border-bottom: 1px solid #ddd;">Comisión 2</td>
                                <td style="padding: 8px; text-align: center;">${total2}</td>
                                <td style="padding: 8px; text-align: center;">${LIMITE_POR_COMISION}</td>
                                <td style="padding: 8px; text-align: center; color: ${LIMITE_POR_COMISION - total2 <= 10 ? '#f59e0b' : '#22c55e'};">${LIMITE_POR_COMISION - total2}</td>
                            </tr>
                            <tr>
                                <td style="padding: 8px; border-bottom: 1px solid #ddd;">Comisión 3</td>
                                <td style="padding: 8px; text-align: center;">${total3}</td>
                                <td style="padding: 8px; text-align: center;">${LIMITE_POR_COMISION}</td>
                                <td style="padding: 8px; text-align: center; color: ${LIMITE_POR_COMISION - total3 <= 10 ? '#f59e0b' : '#22c55e'};">${LIMITE_POR_COMISION - total3}</td>
                            </tr>
                            <tr style="background-color: #e5e7eb; font-weight: bold;">
                                <td style="padding: 8px;">TOTAL</td>
                                <td style="padding: 8px; text-align: center;">${filteredAlumnos.length}</td>
                                <td style="padding: 8px; text-align: center;">${LIMITE_POR_COMISION * 3}</td>
                                <td style="padding: 8px; text-align: center;">${(LIMITE_POR_COMISION * 3) - filteredAlumnos.length}</td>
                            </tr>
                        </table>
                    </div>
                    
                    <h3 style="color: #1e40af; margin-top: 20px; margin-bottom: 10px;">📋 Listado Completo de Alumnos</h3>
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background-color: #3b82f6; color: white;">
                                <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">N°</th>
                                <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Apellido</th>
                                <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Nombre</th>
                                <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">DNI</th>
                                <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Comisión</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sortedForPDF.map((alumno, index) => `
                                <tr>
                                    <td style="padding: 8px; border: 1px solid #ddd;">${index + 1}</td>
                                    <td style="padding: 8px; border: 1px solid #ddd;">${escapeHtml(alumno.apellido)}</td>
                                    <td style="padding: 8px; border: 1px solid #ddd;">${escapeHtml(alumno.nombre)}</td>
                                    <td style="padding: 8px; border: 1px solid #ddd;">${escapeHtml(alumno.dni)}</td>
                                    <td style="padding: 8px; border: 1px solid #ddd;">${alumno.comision}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    
                    <div style="margin-top: 30px; text-align: center; font-size: 10px; color: #9ca3af;">
                        <p>Documento generado automáticamente - Sistema de Distribución de Alumnos</p>
                        <p>Total de alumnos: ${filteredAlumnos.length} | Límite por comisión: ${LIMITE_POR_COMISION}</p>
                    </div>
                `;
                
                const opt = {
                    margin: [0.5, 0.5, 0.5, 0.5],
                    filename: `reporte_alumnos_${new Date().toISOString().split('T')[0]}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, letterRendering: true },
                    jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
                };
                
                html2pdf().set(opt).from(pdfContent).save()
                    .then(() => {
                        showToast('PDF generado correctamente');
                    })
                    .catch((error) => {
                        console.error('Error al generar PDF:', error);
                        showToast('Error al generar el PDF', true);
                    });
            }
            
            // Event listeners
            document.getElementById('applyFiltersBtn').addEventListener('click', applyFilters);
            document.getElementById('clearFiltersBtn').addEventListener('click', clearFilters);
            document.getElementById('refreshBtn').addEventListener('click', loadAlumnos);
            document.getElementById('exportExcelBtn').addEventListener('click', exportToExcel);
            document.getElementById('exportPdfBtn').addEventListener('click', exportToPDF);
            document.getElementById('confirmDeleteBtn').addEventListener('click', confirmDelete);
            document.getElementById('cancelDeleteBtn').addEventListener('click', closeModal);
            
            loadAlumnos();
        });
    </script>
</body>
</html>
